<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Cooter</title>
  <style>
    :root {
      --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --muted: #6b675f;
      --line: #e3e0d8; --accent: #b4531f; --user: #ece7dd; --code: #f0eee8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a; --panel: #1f2124; --ink: #ece9e3; --muted: #9a958c;
        --line: #2c2f33; --accent: #e0894f; --user: #2a2d31; --code: #212327;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.55 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
    }
    header {
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      background: var(--panel); display: flex; align-items: baseline; gap: 10px;
    }
    header h1 { margin: 0; font-size: 18px; letter-spacing: .2px; }
    header .sub { color: var(--muted); font-size: 13px; }
    #log { flex: 1; overflow-y: auto; padding: 22px; max-width: 820px; width: 100%; margin: 0 auto; }
    .msg { margin: 0 0 18px; }
    .msg .role { font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .06em; }
    .bubble { padding: 12px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap; word-wrap: break-word; }
    .msg.user .bubble { background: var(--user); }
    .bubble strong { font-weight: 650; }
    .cite { color: var(--accent); font-weight: 600; }
    .sources { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .sources b { color: var(--ink); font-weight: 600; }
    .sources ul { margin: 6px 0 0; padding-left: 18px; }
    .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
    form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); max-width: 820px; width: 100%; margin: 0 auto; }
    input[type=text] { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; }
    input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button { padding: 0 18px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .blink::after { content: "▍"; animation: b 1s steps(2) infinite; color: var(--muted); }
    @keyframes b { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <header>
    <h1>Ask Cooter</h1>
    <span class="sub">Softail 1984–1999 service manual · answers cite the source page</span>
  </header>
  <div id="log"><div class="empty">Ask a repair question to get started.<br />e.g. “primary chaincase oil capacity” or “how do I test the starter solenoid?”</div></div>
  <form id="form">
    <input id="q" type="text" autocomplete="off" placeholder="Ask about the Softail…" autofocus />
    <button id="send" type="submit">Ask</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const send = document.getElementById("send");
    let busy = false;

    function esc(s) {
      return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }
    // Minimal, safe render: escape, then **bold** and [PDF p.N] highlighting.
    function render(s) {
      let h = esc(s);
      h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      h = h.replace(/\[PDF p\.\d+[^\]]*\]/g, m => `<span class="cite">${m}</span>`);
      return h;
    }

    function addMsg(role) {
      if (log.querySelector(".empty")) log.innerHTML = "";
      const wrap = document.createElement("div");
      wrap.className = "msg " + role;
      wrap.innerHTML = `<div class="role">${role === "user" ? "You" : "Cooter"}</div><div class="bubble"></div>`;
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      return wrap.querySelector(".bubble");
    }

    function renderSources(bubble, sources) {
      if (!sources || !sources.length) return;
      const div = document.createElement("div");
      div.className = "sources";
      div.innerHTML = "<b>Sources</b><ul>" +
        sources.map(s => `<li>${esc(s.citation)}${s.score != null ? ` · ${s.score}` : ""}</li>`).join("") +
        "</ul>";
      bubble.parentElement.appendChild(div);
    }

    async function ask(question) {
      addMsg("user").textContent = question;
      const bubble = addMsg("cooter");
      bubble.classList.add("blink");
      let answer = "";
      let sources = null;

      try {
        const resp = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop();
          for (const part of parts) {
            const line = part.split("\n").find(l => l.startsWith("data:"));
            if (!line) continue;
            const ev = JSON.parse(line.slice(5).trim());
            if (ev.type === "sources") sources = ev.sources;
            else if (ev.type === "token") { answer += ev.text; bubble.innerHTML = render(answer); log.scrollTop = log.scrollHeight; }
            else if (ev.type === "error") { answer += "\n\n[" + ev.message + "]"; bubble.innerHTML = render(answer); }
          }
        }
      } catch (e) {
        bubble.textContent = "Request failed: " + e;
      } finally {
        bubble.classList.remove("blink");
        if (!answer) bubble.textContent = "(no answer)";
        renderSources(bubble, sources);
        log.scrollTop = log.scrollHeight;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question || busy) return;
      busy = true; send.disabled = true; input.value = "";
      try { await ask(question); }
      finally { busy = false; send.disabled = false; input.focus(); }
    });
  </script>
</body>
</html>
